services:
  - type: web
    name: prepkit-api
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build -w @prep/api
    startCommand: npm run start -w @prep/api
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
